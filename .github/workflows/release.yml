name: Release

# Build CD on every supported platform from a tag, and publish the installed
# trees as release archives. Deliberately the same shape as the release
# workflow in lispnik/tecgraf-im, so the two projects are released the same
# way and a change to one is easy to mirror into the other.
#
# This replaces a workflow that could not publish anything: it triggered on
# `push: tags` and then gated its upload on `github.event_name == 'release'`,
# so `git push --tags` built all three platforms and uploaded nothing. It also
# built with CD_ENABLE_IM=OFF, so no CD binary this repository ever published
# could use the IM driver.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (must already exist)'
        required: true

permissions:
  contents: write

# The IM release CD links against. The same pin as the three CI workflows;
# bumping it in all four is the whole of the version-bump procedure.
env:
  IM_VERSION: v2.0.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
            platform: linux
            asset: linux-amd64
            im_asset: linux-amd64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            asset: linux-arm64
            im_asset: linux-arm64
          - name: macOS arm64
            runner: macos-15
            platform: macos
            asset: macos-arm64
            im_asset: macos-arm64
          - name: Windows x64
            runner: windows-2022
            platform: windows
            asset: windows-x64
            im_asset: windows-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine the version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "Building CD ${ref} against IM ${IM_VERSION}"

      # -- Dependencies -----------------------------------------------------
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrender-dev libxft-dev \
            libcairo2-dev libpango1.0-dev \
            libfreetype6-dev libftgl-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            liblua5.4-dev lua5.4 \
            libtiff-dev libpng-dev libjpeg-dev zlib1g-dev \
            libexif-dev liblzf-dev liblz4-dev \
            libfftw3-dev libomp-dev libgtk-3-dev

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install \
            cmake pkg-config cairo pango freetype ftgl lua \
            libtiff libpng jpeg libexif jasper fftw
          echo "PKG_CONFIG_PATH=$(brew --prefix freetype)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "FREETYPE_DIR=$(brew --prefix freetype)" >> $GITHUB_ENV

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v1.3

      - name: Install dependencies with vcpkg (Windows)
        if: matrix.platform == 'windows'
        run: |
          vcpkg install freetype:x64-windows
          vcpkg integrate install

      # -- IM ---------------------------------------------------------------
      # From a release, not from CI artifacts, and not optional. A CD without
      # the IM driver cannot draw an IM image onto a canvas, which is most of
      # why anything here depends on IM at all.
      - name: Download IM ${{ env.IM_VERSION }} (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="tecgraf-im-${IM_VERSION}-${{ matrix.im_asset }}.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/im"
          gh release download "$IM_VERSION" --repo lispnik/tecgraf-im \
            --pattern "$asset" --dir . --clobber
          tar -xzf "$asset" -C "$GITHUB_WORKSPACE/im"
          echo "IM_ROOT=$GITHUB_WORKSPACE/im" >> "$GITHUB_ENV"

      - name: Repair the IM install names (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          for lib in "$IM_ROOT"/lib/libim*.dylib; do
            [ -f "$lib" ] || continue
            install_name_tool -id "$lib" "$lib" 2>/dev/null || true
            otool -L "$lib" | awk 'NR>1 {print $1}' | while read -r dep; do
              case "$dep" in
                */libim*.dylib)
                  base="$(basename "$dep")"
                  [ -f "$IM_ROOT/lib/$base" ] \
                    && install_name_tool -change "$dep" "$IM_ROOT/lib/$base" "$lib" 2>/dev/null || true ;;
              esac
            done
          done

      - name: Download IM ${{ env.IM_VERSION }} (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = "tecgraf-im-$env:IM_VERSION-windows-x64.zip"
          gh release download $env:IM_VERSION --repo lispnik/tecgraf-im `
            --pattern $asset --dir . --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download $asset" }
          # Forward slashes: see the same step in ci-windows.yml.
          $root = (Join-Path $env:GITHUB_WORKSPACE "im") -replace '\\','/' 
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive -Path $asset -DestinationPath $root -Force
          "IM_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          (Join-Path $root "bin") | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # -- Configure --------------------------------------------------------
      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DIM_INCLUDE_DIR=$IM_ROOT/include \
            -DIM_LIBRARY=$IM_ROOT/lib/libim.so \
            -DCD_ENABLE_CAIRO=ON \
            -DCD_ENABLE_GL=ON \
            -DCD_ENABLE_PDF=OFF \
            -DCD_ENABLE_SIM=ON \
            -DCD_ENABLE_IM=ON \
            -DCD_ENABLE_LUA=ON

      - name: Configure (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DIM_INCLUDE_DIR=$IM_ROOT/include \
            -DIM_LIBRARY=$IM_ROOT/lib/libim.dylib \
            -DCD_ENABLE_CAIRO=ON \
            -DCD_ENABLE_XRENDER=OFF \
            -DCD_ENABLE_GL=ON \
            -DCD_ENABLE_PDF=OFF \
            -DCD_ENABLE_SIM=ON \
            -DCD_ENABLE_IM=ON \
            -DCD_ENABLE_QUARTZ=ON \
            -DCD_ENABLE_LUA=ON

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        run: |
          # Assign then interpolate inside quotes rather than writing
          # $env:IM_ROOT/include bare; see ci-windows.yml for what that cost.
          $im = $env:IM_ROOT
          Write-Host "IM_ROOT = $im"
          if (-not (Test-Path "$im/include/im.h")) { throw "im.h is not at $im/include" }
          if (-not (Test-Path "$im/lib/im.lib"))   { throw "im.lib is not at $im/lib" }

          $prefix = "${{ github.workspace }}" -replace '\\','/'

          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix/install" `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DBUILD_SHARED_LIBS=ON `
            -DIM_INCLUDE_DIR="$im/include" `
            -DIM_LIBRARY="$im/lib/im.lib" `
            -DCD_ENABLE_GDIPLUS=ON `
            -DCD_ENABLE_DIRECT2D=ON `
            -DCD_ENABLE_GL=OFF `
            -DCD_ENABLE_PDF=OFF `
            -DCD_ENABLE_SIM=ON `
            -DCD_ENABLE_IM=ON `
            -DCD_ENABLE_LUA=OFF

      # -- Build, test, install ---------------------------------------------
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      # libcd has shipped twice with symbols nothing defines -- Xft, and
      # cdContextCairoPrinter -- because a shared object may keep undefined
      # symbols, so the build stays green and only dlopen fails, in whatever
      # consumes it. `ldd -r` resolves symbols as well as libraries.
      - name: Check for undefined symbols (Linux)
        if: matrix.platform == 'linux'
        run: |
          lib="$(find install -name 'libcd.so.*.*' | head -1)"
          test -n "$lib" || { echo "::error::no libcd to check"; exit 1; }
          if ldd -r "$lib" 2>&1 | grep -q "undefined symbol"; then
            echo "::error::$lib has undefined symbols:"
            ldd -r "$lib" 2>&1 | grep "undefined symbol" | sort -u
            exit 1
          fi
          echo "$lib: no undefined symbols"

      # The IM driver is the reason this release exists in the shape it does,
      # so prove it is actually in the binary rather than trusting the flag.
      - name: Verify the IM driver is present
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux)   lib="$(find install -name 'libcd.so.*.*' | head -1)"
                     syms="$(nm -D --defined-only "$lib" | awk '{print $NF}')" ;;
            macos)   lib="$(find install -name 'libcd.*.dylib' | head -1)"
                     syms="$(nm -gU "$lib" | sed 's/.* _//')" ;;
            # No nm and no strings in Git Bash, and dumpbin is not reliably
            # on PATH. Export names are stored in the DLL as plain
            # null-terminated ASCII, so grep -a finds them directly.
            windows) lib="$(find install -name 'cd.dll' | head -1)"
                     syms="$(grep -ao 'cdCanvasPutImImage' "$lib" | head -1 || true)" ;;
          esac
          test -n "$lib" || { echo "::error::no libcd found in the install tree"; exit 1; }
          if ! printf '%s\n' "$syms" | grep -q '^cdCanvasPutImImage$'; then
            echo "::error::$lib has no cdCanvasPutImImage -- built without the IM driver"
            exit 1
          fi
          echo "$lib exports cdCanvasPutImImage; the IM driver is in."

      # -- Package ----------------------------------------------------------
      - name: Package (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          name="tecgraf-cd-${{ steps.version.outputs.version }}-${{ matrix.asset }}"
          tar -czf "${name}.tar.gz" -C install .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          ls -la "${name}.tar.gz"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $name = "tecgraf-cd-${{ steps.version.outputs.version }}-${{ matrix.asset }}"
          Compress-Archive -Path install/* -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"
          Get-ChildItem "$name.zip"

      - name: Upload the packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            tecgraf-cd-*.tar.gz
            tecgraf-cd-*.tar.gz.sha256
            tecgraf-cd-*.zip
            tecgraf-cd-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Collect the archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: |
          ls -la dist/
          echo
          cat dist/*.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Built against [tecgraf-im ${{ env.IM_VERSION }}](https://github.com/lispnik/tecgraf-im/releases/tag/${{ env.IM_VERSION }}),
            with the IM driver enabled. `libcd` links `libim`, so keep the
            matching IM archive alongside it.
          append_body: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
