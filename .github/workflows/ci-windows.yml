name: Windows CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The IM release this build links against. Kept identical across the three
# CI workflows and release.yml.
env:
  IM_VERSION: v2.0.0

jobs:
  build:
    timeout-minutes: 60
    strategy:
      matrix:
        build_type: [Release, Debug]

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.3

    - name: Install dependencies with vcpkg
      run: |
        vcpkg install freetype:x64-windows
        vcpkg integrate install

    # IM comes from a tagged release, not from CI artifacts. See the same step
    # in ci-linux.yml for why: artifacts expire after 14 days, which is what
    # forced CD_ENABLE_IM=OFF here. Release assets do not expire, so IM
    # support is unconditional and a missing download fails the job.
    - name: Download IM ${{ env.IM_VERSION }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $asset = "tecgraf-im-$env:IM_VERSION-windows-x64.zip"
        gh release download $env:IM_VERSION --repo lispnik/tecgraf-im `
          --pattern $asset --dir . --clobber
        if ($LASTEXITCODE -ne 0) { throw "could not download $asset" }

        $root = Join-Path $env:GITHUB_WORKSPACE "im"
        New-Item -ItemType Directory -Force $root | Out-Null
        Expand-Archive -Path $asset -DestinationPath $root -Force

        $implib = Join-Path $root "lib/im.lib"
        if (-not (Test-Path $implib)) {
          Get-ChildItem -Recurse $root | Select-Object -First 40 FullName
          throw "im.lib is missing from $asset"
        }

        "IM_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        # cd.dll links against im.dll, so the DLL has to be findable when the
        # tests run, not merely when the linker runs.
        (Join-Path $root "bin") | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_INSTALL_PREFIX=../install `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DBUILD_SHARED_LIBS=ON `
          -DIM_INCLUDE_DIR=$env:IM_ROOT/include `
          -DIM_LIBRARY=$env:IM_ROOT/lib/im.lib `
          -DCD_ENABLE_GDIPLUS=ON `
          -DCD_ENABLE_DIRECT2D=ON `
          -DCD_ENABLE_GL=OFF `
          -DCD_ENABLE_PDF=OFF `
          -DCD_ENABLE_SIM=ON `
          -DCD_ENABLE_IM=ON `
          -DCD_ENABLE_LUA=OFF

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Install
      run: |
        cd build
        cmake --install . --config ${{ matrix.build_type }}

    - name: Package artifacts
      run: |
        # Package build outputs directly since install step doesn't create install directory on Windows
        New-Item -ItemType Directory -Path "artifacts\bin" -Force
        New-Item -ItemType Directory -Path "artifacts\lib" -Force
        New-Item -ItemType Directory -Path "artifacts\include" -Force
        New-Item -ItemType Directory -Path "artifacts\fonts" -Force

        # Copy DLLs and executables
        Copy-Item "build\${{ matrix.build_type }}\*.dll" "artifacts\bin\" -ErrorAction SilentlyContinue
        Copy-Item "build\${{ matrix.build_type }}\*.exe" "artifacts\bin\" -ErrorAction SilentlyContinue

        # Copy import libraries (.lib files) - check multiple locations
        Copy-Item "build\${{ matrix.build_type }}\*.lib" "artifacts\lib\" -ErrorAction SilentlyContinue
        Copy-Item "build\*.lib" "artifacts\lib\" -ErrorAction SilentlyContinue

        # Copy header files
        Copy-Item "include\*" "artifacts\include\" -Recurse -ErrorAction SilentlyContinue

        # Copy font files
        Copy-Item "etc\*" "artifacts\fonts\" -Recurse -ErrorAction SilentlyContinue

        # Debug: List what was copied
        Write-Host "=== Files copied ==="
        Get-ChildItem "artifacts" -Recurse | Select-Object Name, FullName

        Compress-Archive -Path "artifacts\*" -DestinationPath cd-windows-${{ matrix.build_type }}.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cd-windows-${{ matrix.build_type }}
        path: cd-windows-${{ matrix.build_type }}.zip

