name: Linux CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The IM release this build links against. Bumping it here is the whole of
# the version-bump procedure; nothing else names a version.
env:
  IM_VERSION: v2.0.0

jobs:
  build:
    timeout-minutes: 60
    strategy:
      # Without this an arm64 failure would cancel the amd64 jobs and hide
      # whether a problem is architecture-specific, which is the main reason
      # for building both.
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        # ubuntu-24.04-arm is GitHub's aarch64 runner, free for public
        # repositories. Added because consumers had no arm64 Linux build of CD
        # to link against: Linux here was x86_64 only, so a downstream project
        # could ship amd64 and macOS and nothing else.
        #
        # Every apt package named below is arch-independent, so the matrix is
        # the only change needed. The artifact name carries the architecture so
        # the two do not collide.
        #
        # arch is a matrix DIMENSION, not something the include entries
        # introduce. An include entry whose keys are all absent from the base
        # matrix is merged into every combination rather than adding one, so
        # listing runner/arch/im_artifact only under include had the arm64
        # entry overwrite the amd64 entry in both build types: the amd64 job
        # vanished and only cd-linux-arm64-* was ever published. Naming arch
        # here means each include matches just the combinations that already
        # have that arch, and adds the runner and artifact to them.
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            im_asset: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            im_asset: linux-arm64

    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }} ${{ matrix.build_type }}

    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/apt
        key: ${{ runner.os }}-${{ runner.arch }}-deps-v2-${{ hashFiles('.github/workflows/ci-linux.yml') }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxext-dev \
          libxrender-dev \
          libxft-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libfreetype6-dev \
          libftgl-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          liblua5.4-dev \
          lua5.4 \
          libtiff-dev \
          libpng-dev \
          libjpeg-dev \
          zlib1g-dev \
          libexif-dev \
          liblzf-dev \
          liblz4-dev \
          libfftw3-dev \
          libomp-dev \
          libgtk-3-dev

    # IM comes from a tagged release, not from CI artifacts.
    #
    # It used to come from artifacts, which expire after 14 days -- so this
    # build could break for no reason connected to any commit, purely because
    # nobody had pushed to tecgraf-im recently. The workaround was to build
    # with CD_ENABLE_IM=OFF and mark the download continue-on-error, which
    # meant CD shipped for a long time with no IM support at all and nobody
    # noticed, because a missing dependency was indistinguishable from a
    # deliberately disabled feature.
    #
    # Release assets do not expire. IM support is now unconditional and the
    # download is allowed to fail the job, because a CD without the IM driver
    # is not a CD anyone here wants.
    - name: Download IM ${{ env.IM_VERSION }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        asset="tecgraf-im-${IM_VERSION}-${{ matrix.im_asset }}.tar.gz"
        mkdir -p "$GITHUB_WORKSPACE/im"
        gh release download "$IM_VERSION" --repo lispnik/tecgraf-im \
          --pattern "$asset" --dir . --clobber
        tar -xzf "$asset" -C "$GITHUB_WORKSPACE/im"
        test -f "$GITHUB_WORKSPACE/im/lib/libim.so" \
          || { echo "::error::libim.so is missing from $asset"; ls -R "$GITHUB_WORKSPACE/im" | head -40; exit 1; }
        echo "IM_ROOT=$GITHUB_WORKSPACE/im" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/im/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX=../install \
          -DIM_INCLUDE_DIR=$IM_ROOT/include \
          -DIM_LIBRARY=$IM_ROOT/lib/libim.so \
          -DCD_ENABLE_CAIRO=ON \
          -DCD_ENABLE_GL=ON \
          -DCD_ENABLE_PDF=OFF \
          -DCD_ENABLE_SIM=ON \
          -DCD_ENABLE_IM=ON \
          -DCD_ENABLE_LUA=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    # Compiled is not the same as reachable; the Windows build shipped
    # src/drv/cdim.c with none of it exported. Cheap to assert here too, and
    # it means a regression fails in CI rather than at a release tag.
    - name: Verify the IM driver is present
      run: |
        lib="$(find build -name 'libcd.so.*.*' | head -1)"
        test -n "$lib" || { echo "::error::no libcd found"; exit 1; }
        if ! nm -D --defined-only "$lib" | awk '{print $NF}' | grep -q '^cdCanvasPutImImage$'; then
          echo "::error::$lib has no cdCanvasPutImImage -- built without the IM driver"
          exit 1
        fi
        echo "$lib exports cdCanvasPutImImage"

    - name: Install
      run: |
        cd build
        cmake --install . --config ${{ matrix.build_type }}

    # A shared object is allowed to keep undefined symbols, so a missing
    # -lXft links cleanly and only fails at dlopen, in whatever consumes it.
    # That is how libcd shipped for a while calling ten Xft functions without
    # linking Xft: every downstream dlopen died on "undefined symbol:
    # XftFontClose" while this build stayed green. `ldd -r` resolves symbols
    # as well as libraries, which is what catches it here instead.
    - name: Check for undefined symbols
      run: |
        lib="$(find install -name 'libcd.so.*.*' | head -1)"
        test -n "$lib" || { echo "::error::no libcd to check"; exit 1; }
        if ldd -r "$lib" 2>&1 | grep -q "undefined symbol"; then
          echo "::error::$lib has undefined symbols:"
          ldd -r "$lib" 2>&1 | grep "undefined symbol" | sort -u
          exit 1
        fi
        echo "$lib: no undefined symbols"

    - name: Package artifacts
      run: |
        tar -czf cd-linux-${{ matrix.arch }}-${{ matrix.build_type }}.tar.gz install/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cd-linux-${{ matrix.arch }}-${{ matrix.build_type }}
        path: cd-linux-${{ matrix.arch }}-${{ matrix.build_type }}.tar.gz

