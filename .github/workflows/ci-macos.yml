name: macOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The IM release this build links against. Kept identical across the three
# CI workflows and release.yml.
env:
  IM_VERSION: v2.0.0

jobs:
  build:
    timeout-minutes: 60
    strategy:
      matrix:
        build_type: [Release, Debug]
        arch_config: [
          {name: "arm64", cmake_arch: "arm64", suffix: "arm64"}
        ]

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          /opt/homebrew/Cellar
          /opt/homebrew/lib
          /opt/homebrew/include
        key: ${{ runner.os }}-deps-v2-${{ hashFiles('.github/workflows/ci-macos.yml') }}

    - name: Install system dependencies
      run: |
        brew install \
          cmake \
          pkg-config \
          cairo \
          pango \
          freetype \
          ftgl \
          lua \
          libtiff \
          libpng \
          jpeg \
          libexif \
          jasper \
          fftw

        # Set up environment for FreeType detection
        echo "PKG_CONFIG_PATH=$(brew --prefix freetype)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "FREETYPE_DIR=$(brew --prefix freetype)" >> $GITHUB_ENV

    # IM comes from a tagged release, not from CI artifacts. See the same
    # step in ci-linux.yml for why: artifacts expire after 14 days, which is
    # what forced CD_ENABLE_IM=OFF here. Release assets do not expire, so IM
    # support is unconditional and a missing download fails the job.
    - name: Download IM ${{ env.IM_VERSION }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        asset="tecgraf-im-${IM_VERSION}-macos-arm64.tar.gz"
        mkdir -p "$GITHUB_WORKSPACE/im"
        gh release download "$IM_VERSION" --repo lispnik/tecgraf-im \
          --pattern "$asset" --dir . --clobber
        tar -xzf "$asset" -C "$GITHUB_WORKSPACE/im"
        test -f "$GITHUB_WORKSPACE/im/lib/libim.dylib" \
          || { echo "::error::libim.dylib is missing from $asset"; ls -R "$GITHUB_WORKSPACE/im" | head -40; exit 1; }
        echo "IM_ROOT=$GITHUB_WORKSPACE/im" >> "$GITHUB_ENV"
        echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/im/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    # IM builds dylibs with absolute install names -- deliberately, since that
    # makes them loadable with no rpath. The name baked in is the path on the
    # machine that built them, which is not where they are now, so libcd would
    # record a dependency on a path that does not exist here. Restamp each to
    # where it actually is before linking against it.
    - name: Repair the IM install names
      run: |
        set -euo pipefail
        for lib in "$IM_ROOT"/lib/libim*.dylib; do
          [ -f "$lib" ] || continue
          install_name_tool -id "$lib" "$lib" 2>/dev/null || true
          otool -L "$lib" | awk 'NR>1 {print $1}' | while read -r dep; do
            case "$dep" in
              */libim*.dylib)
                base="$(basename "$dep")"
                [ -f "$IM_ROOT/lib/$base" ] \
                  && install_name_tool -change "$dep" "$IM_ROOT/lib/$base" "$lib" 2>/dev/null || true ;;
            esac
          done
        done
        otool -L "$IM_ROOT/lib/libim.dylib" | head -5

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX=../install \
          -DIM_INCLUDE_DIR=$IM_ROOT/include \
          -DIM_LIBRARY=$IM_ROOT/lib/libim.dylib \
          -DCD_ENABLE_CAIRO=ON \
          -DCD_ENABLE_XRENDER=OFF \
          -DCD_ENABLE_GL=ON \
          -DCD_ENABLE_PDF=OFF \
          -DCD_ENABLE_SIM=ON \
          -DCD_ENABLE_IM=ON \
          -DCD_ENABLE_QUARTZ=ON \
          -DCD_ENABLE_LUA=ON \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch_config.cmake_arch }}"

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    # Compiled is not the same as reachable; the Windows build shipped
    # src/drv/cdim.c with none of it exported. Cheap to assert here too, and
    # it means a regression fails in CI rather than at a release tag.
    - name: Verify the IM driver is present
      run: |
        lib="$(find build -name 'libcd.*.dylib' | head -1)"
        test -n "$lib" || { echo "::error::no libcd found"; exit 1; }
        if ! nm -gU "$lib" | sed 's/.* _//' | grep -q '^cdCanvasPutImImage$'; then
          echo "::error::$lib has no cdCanvasPutImImage -- built without the IM driver"
          exit 1
        fi
        echo "$lib exports cdCanvasPutImImage"

    - name: Install
      run: |
        cd build
        cmake --install . --config ${{ matrix.build_type }}

    - name: Package artifacts
      run: |
        tar -czf cd-macos-${{ matrix.build_type }}-${{ matrix.arch_config.suffix }}.tar.gz install/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cd-macos-${{ matrix.build_type }}-${{ matrix.arch_config.suffix }}
        path: cd-macos-${{ matrix.build_type }}-${{ matrix.arch_config.suffix }}.tar.gz

